<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Registration Form</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Custom CSS -->
<link rel="stylesheet" href="css/style.css?v=1">

</head>
<body>

  <!-- NAVBAR (Bootstrap Component 1) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-gradient shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#">MyWebsite</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- HEADER -->
  <header class="text-center py-4 shadow-sm" id="main-header">
    <h1>Welcome to My Website</h1>
    <p>Please fill out the form below to register</p>
  </header>

  <!-- MAIN -->
  <main class="container py-5">
    <div class="row align-items-center">
      
      <!-- Image Section -->
      <div class="col-md-6 mb-4 mb-md-0">
        <img src="image.jpg" class="img-fluid rounded shadow" alt="Registration Image" />
      </div>

      <!-- Form Section -->
      <div class="col-md-6">
        <article aria-labelledby="reg-heading">
          <section>
            <h2 id="reg-heading" class="text-center mb-4">User Registration</h2>

            <!-- Form Box (Bootstrap Card Component 2) -->
            <div class="card p-4 shadow" id="registerCard">
              <form id="registerForm" novalidate>

                <!-- Name and Email Side by Side -->
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" required />
                  </div>
                  <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required />
                  </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" id="password" name="password" class="form-control" required minlength="6" />
                </div>

                <!-- Gender -->
                <fieldset class="mb-3">
                  <legend>Gender</legend>
                  <div class="form-check">
                    <input type="radio" class="form-check-input" id="male" name="gender" value="male" />
                    <label class="form-check-label" for="male">Male</label>
                  </div>
                  <div class="form-check">
                    <input type="radio" class="form-check-input" id="female" name="gender" value="female" />
                    <label class="form-check-label" for="female">Female</label>
                  </div>
                  <div class="form-check">
                    <input type="radio" class="form-check-input" id="other" name="gender" value="other" />
                    <label class="form-check-label" for="other">Other</label>
                  </div>
                </fieldset>

                <!-- Terms -->
                <div class="form-check mb-3">
                  <input type="checkbox" class="form-check-input" id="terms" required />
                  <label for="terms" class="form-check-label">I agree to the terms and conditions</label>
                </div>

                <!-- Button -->
                <button type="submit" class="btn w-100">Register</button>

              </form>
            </div>
          </section>
        </article>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center py-3 mt-5">
    <p>&copy; 2025 Hiba Shaukat. All rights reserved.</p>
  </footer>

  <!-- Modal (Bootstrap Component 3) -->
  <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="successModalLabel">Success!</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Registration completed successfully! 🎉
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-success" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Form Validation Script -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const form = document.getElementById("registerForm");
      const successModal = new bootstrap.Modal(document.getElementById('successModal'));

      form.addEventListener("submit", function(event) {
        event.preventDefault();
        const password = document.getElementById("password").value.trim();
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const terms = document.getElementById("terms").checked;

        if (!name || !email || !password) {
          alert("Please fill out all fields!");
          return;
        }
        if (password.length < 6) {
          alert("Password must be at least 6 characters long!");
          return;
        }
        if (!terms) {
          alert("Please agree to the terms and conditions!");
          return;
        }

        // Show Bootstrap Modal on success
        successModal.show();
        form.reset();
      });
    });
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
